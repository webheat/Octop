# CNB 云原生构建流水线
#
# 本机只做冒烟验证，全量校验与发行产物统一在这里跑：GitHub Actions 在本仓库
# 被禁用（token 无 admin 权限，workflow_dispatch 返回 422），CNB 是唯一能跑
# CI 的地方；本机也没有 make，pre-commit 的完整门禁跑不起来。
#
#   push 到 main           → 全量质量门禁（ruff / mypy / pytest）
#   推送 v* tag            → 质量门禁 → 构建 Dashboard → 建 Release → 挂产物
#   api_trigger_release    → 与 tag 流水线同一条链路，target tag 由 RELEASE_TAG 传入
#
# 为什么还要一条 api_trigger 的发版流水线：git 凭据里的 access token 只有 git
# 相关 scope，读不到 /-/build/logs（需要 repo-cnb-history:r），tag_push 的流水线
# 一旦失败就成了黑盒。走 API 触发可以直接拿到构建号，再用
# /-/build/status/{sn} 查状态与失败阶段。
#
# 依赖安装拆成三个独立 stage 也是同一个理由：日志读不到时，失败 stage 的名字
# 就是唯一的诊断信号——是索引不通、还是运行期依赖、还是测试工具装不上。

main:
  push:
    - name: quality-gate
      docker:
        image: python:3.12-bookworm
      env:
        PIP_INDEX_URL: https://mirrors.cloud.tencent.com/pypi/simple
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PIP_NO_INPUT: "1"
        UV_INDEX_URL: https://mirrors.cloud.tencent.com/pypi/simple
        UV_HTTP_TIMEOUT: "120"
        UV_LINK_MODE: copy
      stages:
        - name: install uv
          script: |
            python -V
            pip install uv
            uv --version
        # 用 uv 而不是 pip：pip 解析这份依赖图会回溯十几分钟并最终失败，
        # uv 的解析器是毫秒级的。
        - name: install deps
          script: |
            # 用项目自己的 .venv 而不是往镜像里装（--system）：mypy 会把跟随
            # 到的依赖模块一起分析，环境里多装的包会凭空多出错误。uv sync 复
            # 现的正是本机能跑通的那一套。
            uv sync
            # 门禁工具钉到与本机一致的版本：pyproject 里 ruff/mypy 都是浮动下
            # 限，CI 每次拉最新版会把新版本新增的检查变成与提交无关的红点。
            uv pip install "ruff==0.15.20" "mypy==2.1.0"
            uv run python -c "import fastapi, pytest; print('deps ok')"
            uv run ruff --version
            uv run mypy --version
        - name: lint
          script: |
            uv run ruff check src tests
            uv run ruff format --diff src tests
        - name: typecheck
          script: |
            uv run mypy src/octop
        - name: test
          script: |
            # 失败清单必须能被读到：仓库的 access token 只有 git scope，读不到
            # /-/build/logs，CI 失败就成黑盒。所以失败时把摘要推到 ci/reports
            # 分支，用 git 这条唯一可用的通道取回来。
            uv run pytest -n 4 -m "not live" -q --tb=line > /tmp/pytest.log 2>&1 || true
            tail -c 20000 /tmp/pytest.log > /tmp/report.txt || true
            if grep -qE "[0-9]+ (failed|error)" /tmp/pytest.log; then
              git config user.email "ci@cnb.cool"
              git config user.name "cnb-ci"
              cp /tmp/report.txt .ci-pytest-report.txt
              git add -f .ci-pytest-report.txt
              git commit -q -m "ci: pytest failures" || true
              git push origin HEAD:refs/heads/ci/reports --force || echo "report push failed"
              exit 1
            fi
            tail -5 /tmp/pytest.log

  # 手动补发/重发一次发行版：tag 已经在远端，只需要重新构建并挂产物。
  api_trigger_release:
    - name: release
      docker:
        image: python:3.12-bookworm
      env:
        PIP_INDEX_URL: https://mirrors.cloud.tencent.com/pypi/simple
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PIP_NO_INPUT: "1"
        UV_INDEX_URL: https://mirrors.cloud.tencent.com/pypi/simple
        UV_HTTP_TIMEOUT: "120"
        UV_LINK_MODE: copy
        # 构建产物由 /videogen 子路径提供，与线上 nginx 的挂载保持一致。
        BASE_URL: /videogen
      stages:
        - name: check target tag
          script: |
            test -n "$RELEASE_TAG" || { echo "RELEASE_TAG is required"; exit 1; }
            echo "releasing $RELEASE_TAG"
        - name: install uv
          script: |
            python -V
            pip install uv
            uv --version
        # 用 uv 而不是 pip：pip 解析这份依赖图会回溯十几分钟并最终失败，
        # uv 的解析器是毫秒级的。
        - name: install deps
          script: |
            # 用项目自己的 .venv 而不是往镜像里装（--system）：mypy 会把跟随
            # 到的依赖模块一起分析，环境里多装的包会凭空多出错误。uv sync 复
            # 现的正是本机能跑通的那一套。
            uv sync
            # 门禁工具钉到与本机一致的版本：pyproject 里 ruff/mypy 都是浮动下
            # 限，CI 每次拉最新版会把新版本新增的检查变成与提交无关的红点。
            uv pip install "ruff==0.15.20" "mypy==2.1.0"
            uv run python -c "import fastapi, pytest; print('deps ok')"
            uv run ruff --version
            uv run mypy --version
        - name: lint
          script: |
            uv run ruff check src tests
            uv run ruff format --diff src tests
        - name: typecheck
          script: |
            uv run mypy src/octop
        - name: test
          script: |
            # 失败清单必须能被读到：仓库的 access token 只有 git scope，读不到
            # /-/build/logs，CI 失败就成黑盒。所以失败时把摘要推到 ci/reports
            # 分支，用 git 这条唯一可用的通道取回来。
            uv run pytest -n 4 -m "not live" -q --tb=line > /tmp/pytest.log 2>&1 || true
            tail -c 20000 /tmp/pytest.log > /tmp/report.txt || true
            if grep -qE "[0-9]+ (failed|error)" /tmp/pytest.log; then
              git config user.email "ci@cnb.cool"
              git config user.name "cnb-ci"
              cp /tmp/report.txt .ci-pytest-report.txt
              git add -f .ci-pytest-report.txt
              git commit -q -m "ci: pytest failures" || true
              git push origin HEAD:refs/heads/ci/reports --force || echo "report push failed"
              exit 1
            fi
            tail -5 /tmp/pytest.log
        - name: build dashboard
          image: node:22-bookworm
          script: |
            cd dashboard
            npm ci --registry=https://registry.npmmirror.com --no-audit --no-fund
            npm run build
            cd ..
            mkdir -p dist-release
            # 产物目录在 .gitignore 里（不入库），所以必须现构建现打包。
            tar -czf "dist-release/octop-dashboard-${RELEASE_TAG}.tar.gz" \
              -C src/octop/dashboard .
            ls -lh dist-release/
        - name: create release
          type: git:release
          options:
            tag: ${RELEASE_TAG}
            title: ${RELEASE_TAG}
            descriptionFromFile: CHANGELOG.md
        # git:release 只把源码打包上传，任意产物要靠 attachments 插件，
        # 且必须在 Release 已存在之后执行。
        - name: upload dashboard artifact
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "dist-release/*.tar.gz"

