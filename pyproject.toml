[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "octop"
version = "1.4.0"
description = "Smarter self-hosted AI assistant for multiple users and agents, built on octop-harness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{name = "octop contributors"}]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6,<2.14",
    "langchain-core>=1.4.8",
    "click>=8.1",
    "rich>=13.7",
    "questionary>=2.0",
    "apscheduler>=3.10,<4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "octop-harness[all]>=1.0.10",
    "octop-memory>=1.0.4",
    "lark-oapi>=1.7.3",
    "octop-gateway>=1.0.3",
    "cryptography>=41",
    "scalar-fastapi>=1.0",
    "edge-tts>=6.1",
    "segno>=1.6",
    "websockets>=13.0",
    # websockets raises "python-socks is required to use a SOCKS proxy" when
    # the host has a SOCKS proxy env and this package is absent — the browser
    # host's CDP connection then fails to attach.
    "python-socks>=2.4",
    "acme>=5.6.0",
    "josepy>=2.2.0",
    "boto3>=1.40.61",
    "octop-browser>=1.0.0",
    "psycopg[binary]>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
    "mcp>=1.9,<2",
    "pillow>=13.0.0",
    "numpy>=1.26",
    "pypdf>=5.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0",
    "pypinyin>=0.53",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "ldap3>=2.9.1",
    "firecrawl-anydoc>=0.2.4",
    "pyotp>=2.10.0",
    "webauthn>=3.0.1",
]

[project.optional-dependencies]
# PEP 621 extras — kept so `pip install -e ".[dev]"` keeps working for
# legacy / CI flows. `uv sync` reads `[dependency-groups].dev` below.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-testmon>=2.0",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "build>=1.0",
    "xlwt>=1.3",
    # The cloud integration tests import the SDK directly; the runtime extra
    # (`tencentcloud`) is not installed by plain `uv sync`.
    "tencentcloud-sdk-python>=3.1.166",
]
# Remote-browser automation. Chromium itself is not bundled — the dashboard
# downloads it on demand via POST /api/browser/install.
browser = [
    "playwright>=1.40",
]
# Tencent Cloud CVM inventory/monitoring for the Workbench cloud tab.
tencentcloud = ["tencentcloud-sdk-python>=3.1.166"]
# Volcengine TOS object storage (Admin storage kind ``tos``).
tos = ["tos>=2.9,<3"]
# Kept for backward compatibility; pillow is now a core dependency.
desktop = ["mss>=9.0", "pynput>=1.7"]
# Local ONNX / fastembed embedding models (Models admin local tab).
local-embedding = ["fastembed>=0.4", "huggingface_hub>=0.20"]
knowledge-ocr = [
    "rapidocr>=3.4,<4",
    "onnxruntime>=1.17",
    "pymupdf>=1.24",
    "shapely>=2.2.0",
]

[dependency-groups]
# PEP 735 dev group — installed by default on `uv sync`. Mirrors the
# `[project.optional-dependencies].dev` list above.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-testmon>=2.0",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "build>=1.0",
    "xlwt>=1.3",
    # The cloud integration tests import the SDK directly; the runtime extra
    # (`tencentcloud`) is not installed by plain `uv sync`.
    "tencentcloud-sdk-python>=3.1.166",
]

[project.scripts]
octop = "octop.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/octop"]

# Ship only reviewed renderer sources; exclude node_modules, local jobs, and outputs.
[tool.hatch.build.targets.wheel.force-include]
"remotion/src" = "octop/infra/product_library/render_template/src"
"remotion/package.json" = "octop/infra/product_library/render_template/package.json"
"remotion/package-lock.json" = "octop/infra/product_library/render_template/package-lock.json"
"remotion/remotion.config.ts" = "octop/infra/product_library/render_template/remotion.config.ts"
"remotion/tsconfig.json" = "octop/infra/product_library/render_template/tsconfig.json"
"remotion/render.mjs" = "octop/infra/product_library/render_template/render.mjs"
"remotion/launch.mjs" = "octop/infra/product_library/render_template/launch.mjs"
"remotion/project.mjs" = "octop/infra/product_library/render_template/project.mjs"
"remotion/launchers" = "octop/infra/product_library/render_template/launchers"

[tool.hatch.build.targets.sdist.force-include]
"remotion/src" = "remotion/src"
"remotion/package.json" = "remotion/package.json"
"remotion/package-lock.json" = "remotion/package-lock.json"
"remotion/remotion.config.ts" = "remotion/remotion.config.ts"
"remotion/tsconfig.json" = "remotion/tsconfig.json"
"remotion/render.mjs" = "remotion/render.mjs"
"remotion/launch.mjs" = "remotion/launch.mjs"
"remotion/project.mjs" = "remotion/project.mjs"
"remotion/launchers" = "remotion/launchers"

[tool.hatch.build]
include = [
    "src/octop/**/*.py",
    "src/octop/**/*.json",
    "src/octop/**/*.md",
    "src/octop/**/*.sql",
    "src/octop/**/*.sh",
    "src/octop/**/*.png",
    "src/octop/**/*.jpg",
    "src/octop/dashboard/**/*",
    "src/octop/infra/agents/experts/library/**/*",
    "src/octop/infra/agents/plugins/bundled/**/*",
    "src/octop/infra/agents/subagents/library/**/*",
    "src/octop/infra/agents/subagents/divisions.json",
    "src/octop/infra/control/desktop/scripts/**/*",
]
artifacts = [
    "src/octop/dashboard/**/*",
]

[tool.uv]
# 内网 PyPI 源（192.168.20.173:4874）已下线，改用腾讯云公网镜像。
# 与 /root/.pip/pip.conf 保持一致；uv.lock 里的 registry 由 `uv lock` 重新钉住。
index-url = "https://mirrors.tencentyun.com/pypi/simple"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
include = ["*.py", "*.pyi", "*.pyw", "*.ipynb", "**/pyproject.toml", "**/ruff.toml", "**/.ruff.toml"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"src/octop/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/octop"]
exclude = [
    "src/octop/dashboard/",
    "src/octop/infra/agents/experts/library/",
    "src/octop/infra/agents/plugins/bundled/",
    "src/octop/infra/agents/subagents/library/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.auth"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.health"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.setup"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.users"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.agents"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.providers"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.chat"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.channels"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.cron"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.routers.admin"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.api.app"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "octop.infra.utils.posix_compat"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "octop.infra.utils.subprocess_io_win"
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Keep pytest's tmp_path tree out of the system temp directory. The autouse
# ``_isolated_user_home`` fixture in tests/conftest.py builds a throwaway HOME
# per test case, and the octop logger writes a multi-MB log into each one, so
# the default retention under %TEMP% / /tmp grew to several GB.
# ``basetemp`` is only settable on the command line -- it is not a registered
# ini option -- so it has to travel via ``addopts``. pytest wipes that directory
# at the start of every run, so nothing accumulates between sessions.
# The path is relative (git-ignored ``.pytest-tmp/``) rather than absolute so
# the same setting works on Windows, Linux and macOS runners alike.
addopts = "--basetemp=./.pytest-tmp"
markers = [
    "live: tests that hit real LLM / external services (skipped by default)",
    "slow: expensive tests (integration boot, real harness, browser); skipped by make test-fast",
    "postgresql: tests that need a live PostgreSQL (set OCTOP_TEST_DATABASE_URL)",
]
# The project pins a starlette fork (1.3.1) whose TestClient prefers a
# private ``httpx2`` build that is not installable from PyPI. When ``httpx2``
# is absent it falls back to ``httpx`` and emits a non-actionable
# StarletteDeprecationWarning on every ``starlette.testclient`` import. The
# fallback is intentional for this environment, so silence the noise.
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
