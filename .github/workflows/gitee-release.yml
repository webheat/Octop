name: Gitee Release

# 把某个 v* GitHub Release 上的合规产物发布到 Gitee。
#
# Gitee 单个附件上限 100 MB：完整客户端安装器（~300 MB）和 portable 运行时
# （~290 MB）都超限，留在 GitHub Release 上，超限的产物在 Release 说明里给外链。
#
# Gitee 上只挂"远程版读者要装的东西"：客户端本身 + 视频制作组件。slim 客户端
# （首次启动要另外下载运行时）与 wheel / sdist 不在这里分发 —— 下载页与 Release
# 说明都不提供它们，传上去只会多出没人链接的附件。判定规则见
# scripts/gitee/assets.py。
#
# 本轮只发 Windows 版（见 docs/desktop-windows-build.md）：macOS 与 Linux 的
# 产物不上传。用 platform 输入改成 all 可以发全平台。
#
# 需要仓库 Secrets：
#   GITEE_TOKEN  Gitee Personal Access Token（projects 权限）
#   GH_PAT       读取别的 GitHub 仓库的 Release 资产时需要。本仓库的 Release
#                用自带的 GITHUB_TOKEN 就够。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.4.0"
        required: true
        type: string
      source_repo:
        description: "资产来源的 GitHub 仓库（owner/repo），留空用本仓库"
        required: false
        default: ""
        type: string
      gitee_owner:
        description: "Gitee 仓库 owner"
        required: false
        default: "webheat"
        type: string
      gitee_repo:
        description: "Gitee 仓库名"
        required: false
        default: "octop_client"
        type: string
      platform:
        description: "本轮交付的平台：windows（默认）/ all"
        required: false
        default: "windows"
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Gitee
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      SOURCE_REPO: ${{ inputs.source_repo || github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check credentials
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${GITEE_TOKEN}" ]] || missing+=("GITEE_TOKEN")
          if [[ "${SOURCE_REPO}" != "${{ github.repository }}" && -z "${GH_PAT}" ]]; then
            missing+=("GH_PAT (needed for ${SOURCE_REPO})")
          fi
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::missing secrets: ${missing[*]}" >&2
            exit 1
          fi
          [[ -n "${{ inputs.gitee_owner }}" ]] || { echo "::error::gitee_owner is empty" >&2; exit 1; }
          [[ -n "${{ inputs.gitee_repo }}" ]] || { echo "::error::gitee_repo is empty" >&2; exit 1; }

      - name: Publish to Gitee
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          SOURCE_REPO: ${{ inputs.source_repo || github.repository }}
        run: |
          set -euo pipefail
          # One implementation, so CI and a local run cannot drift apart:
          # download the assets → build the notes → sync the download page →
          # create the Gitee release and upload. Which assets Gitee carries is
          # decided in scripts/gitee/assets.py.
          bash scripts/gitee/publish_from_github.sh \
            --tag "${{ inputs.tag }}" \
            --source-repo "${SOURCE_REPO}" \
            --owner "${{ inputs.gitee_owner }}" \
            --repo "${{ inputs.gitee_repo }}" \
            --platform "${{ inputs.platform || 'windows' }}"
